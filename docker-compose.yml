services:
  db:
    image: postgis/postgis:17-3.5-alpine 
    restart: always
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432" # Host port is 5434, container port is 5432

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"

  backend:
    build: ./backend
    command: [
      "../wait-for-it.sh", "db:5432", "--",
      "python", "manage.py", "runserver", "0.0.0.0:8000"
    ]
    volumes:
      - ./backend:/code
    ports:
      - "8002:8000"
    depends_on:
      - db
      - redis
    env_file:
      - .env

  celery:
    build: ./backend
    command: [
      "../wait-for-it.sh", "db:5432", "--",
      "../wait-for-it.sh", "redis:6379", "--",
      "celery", "-A", "medfinder", "worker", "-l", "info"
    ]
    volumes:
      - ./backend:/code
    depends_on:
      - db
      - redis
    env_file:
      - .env

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Don't overwrite container's node_modules
    depends_on:
      - backend

volumes: 
  pgdata:
