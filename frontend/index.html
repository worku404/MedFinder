<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MedFinder — search medicine availability across verified pharmacies near you." />
    <title>MedFinder</title>
    <!-- Google Fonts — one pairing for the whole app (see styles/tokens.css):
         Space Grotesk (display) / IBM Plex Sans (body) / IBM Plex Mono (data/utility) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set the theme attribute before React mounts, so there's no flash
      // of the wrong theme on load. Mirrors the logic in
      // context/ThemeContext.jsx exactly — keep the two in sync.
      (function () {
        var stored = localStorage.getItem("medfinder-theme");
        var theme =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
